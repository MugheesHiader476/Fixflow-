name: SonarQube Analysis

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  sonar:
    runs-on: ubuntu-latest

    services:
      db:
        image: pgvector/pgvector:pg18
        env:
          POSTGRES_USER: fixflow
          POSTGRES_DB: fixflow_test
          # This database is isolated to the ephemeral Actions runner.
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fixflow -d fixflow_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22
          cache: npm

      - name: Install frontend dependencies
        run: npm ci --ignore-scripts

      - name: Setup Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.lock.txt

      - name: Install backend dependencies
        run: 'pip install --require-hashes --only-binary=:all: -r requirements-dev.lock.txt'

      - name: Install pinned external Playwright tooling
        run: |
          npm install --prefix "$RUNNER_TEMP/fixflow-browser-tools" --save-exact playwright@1.62.1
          node "$RUNNER_TEMP/fixflow-browser-tools/node_modules/playwright/cli.js" install --with-deps chromium
          node <<'JS'
          const fs = require("node:fs");
          const path = require("node:path");
          const tools = path.join(process.env.RUNNER_TEMP, "fixflow-browser-tools/node_modules/playwright");
          const { chromium } = require(tools);
          fs.appendFileSync(process.env.GITHUB_ENV,
            "FIXFLOW_BROWSER_TOOLS=" + tools + "\nFIXFLOW_CHROME=" + chromium.executablePath() + "\n");
          JS

      - name: Run complete evaluation with disposable data
        run: python scripts/evaluate.py
        env:
          TEST_DATABASE_URL: postgresql+asyncpg://fixflow@localhost:5432/fixflow_test
          # Synthetic build configuration only; no paid/live identity or provider credentials.
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: pk_test_Zml4Zmxvdy1ldmFsdWF0aW9uLmNsZXJrLmFjY291bnRzLmRldiQ
          CLERK_SECRET_KEY: sk_test_evaluation_only_not_a_real_account

      - name: Upload evaluation evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: fixflow-evaluation-evidence
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14
          path: |
            .local/evaluation/*.log
            .local/evaluation/*.json
            .local/evaluation/*.xml
            .local/evaluation/*.html
            .local/evaluation/*.png
            .local/evaluation/*.zip
            .local/evaluation/component-browser/

      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@c7ee0f9df90b7aa20e8dcf9695dcfe2e7da5b4f2 # v7.2.1
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
