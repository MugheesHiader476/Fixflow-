[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["backend/tests", "scripts/tests"]
addopts = [
    "--strict-config",
    "--strict-markers",
    "--cov=backend",
    "--cov=scripts",
    "--cov-report=term-missing",
    "--cov-report=xml",
]

[tool.coverage.run]
branch = true
source = ["backend", "scripts"]
omit = ["backend/tests/*", "scripts/tests/*"]

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.coverage.xml]
output = "coverage/python-coverage.xml"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "BLE", "C4", "PERF", "PLC", "SIM", "FURB", "RUF"]

[tool.mypy]
python_version = "3.12"
check_untyped_defs = true
disallow_any_generics = true
no_implicit_optional = true
warn_redundant_casts = true
warn_return_any = true
warn_unreachable = true

[[tool.mypy.overrides]]
module = ["langchain_community.*", "langchain_core.*", "langchain_text_splitters.*", "asyncpg.*"]
ignore_missing_imports = true
