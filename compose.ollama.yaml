# Optional local AI sidecar. It shares the backend's network namespace, so loopback
# stays private and satisfies both local transports without exposing Ollama publicly.
services:
  ollama:
    image: ${OLLAMA_IMAGE:?Set a reviewed Ollama container tag or digest}
    network_mode: service:backend
    environment:
      OLLAMA_HOST: 127.0.0.1:11434
      OLLAMA_NUM_PARALLEL: "1"
      OLLAMA_MAX_LOADED_MODELS: "1"
      OLLAMA_FLASH_ATTENTION: ${OLLAMA_FLASH_ATTENTION:-1}
      OLLAMA_KV_CACHE_TYPE: ${OLLAMA_KV_CACHE_TYPE:-f16}
    volumes:
      - fixflow_ollama:/root/.ollama
    depends_on:
      backend:
        condition: service_started
    restart: unless-stopped

volumes:
  fixflow_ollama:
