# Rebuild from the current checkout on every `docker compose up`, using layer cache.
x-backend-image: &backend-image
  image: fixflow-backend:local
  pull_policy: build
  build:
    context: .
    dockerfile: Dockerfile.backend

x-backend-environment: &backend-environment
  FIXFLOW_API_TOKEN: ${FIXFLOW_API_TOKEN:?Set FIXFLOW_API_TOKEN in .env}
  POSTGRES_HOST: db
  POSTGRES_PORT: "5432"
  POSTGRES_DB: ${POSTGRES_DB:-fixflow}
  POSTGRES_USER: ${POSTGRES_USER:-fixflow}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
  FIXFLOW_DATA_DIR: /app/data
  FRONTEND_ORIGINS: ${FRONTEND_ORIGINS:-http://localhost:3000}
  MAX_EXTRACTED_CHARS: ${MAX_EXTRACTED_CHARS:-5000000}
  EVIDENCE__API_KEY: ${EVIDENCE__API_KEY:-}
  EVIDENCE__MODEL: ${EVIDENCE__MODEL:-}
  EVIDENCE__TIMEOUT_SECONDS: ${EVIDENCE__TIMEOUT_SECONDS:-12}
  EVIDENCE__MAX_OUTPUT_TOKENS: ${EVIDENCE__MAX_OUTPUT_TOKENS:-800}
  EVIDENCE__REQUESTS_PER_MINUTE: ${EVIDENCE__REQUESTS_PER_MINUTE:-5}
  GROK__API_KEY: ${GROK__API_KEY:-}
  GROK__MODEL: ${GROK__MODEL:-}
  GROK__REASONING_EFFORT: ${GROK__REASONING_EFFORT-low}
  GROK__MAX_STEPS: ${GROK__MAX_STEPS:-12}
  GROK__TIMEOUT_SECONDS: ${GROK__TIMEOUT_SECONDS:-25}
  GROK__INPUT_TOKEN_LIMIT: ${GROK__INPUT_TOKEN_LIMIT:-16000}
  GROK__MAX_OUTPUT_TOKENS: ${GROK__MAX_OUTPUT_TOKENS:-1800}
  GROK__REQUESTS_PER_MINUTE: ${GROK__REQUESTS_PER_MINUTE:-10}
  GROK__RUN_TIMEOUT_SECONDS: ${GROK__RUN_TIMEOUT_SECONDS:-600}
  SECURITY__READ_REQUESTS_PER_MINUTE: ${SECURITY__READ_REQUESTS_PER_MINUTE:-240}
  SECURITY__WRITE_REQUESTS_PER_MINUTE: ${SECURITY__WRITE_REQUESTS_PER_MINUTE:-60}
  SECURITY__SENSITIVE_REQUESTS_PER_MINUTE: ${SECURITY__SENSITIVE_REQUESTS_PER_MINUTE:-10}
  SECURITY__AUTH_FAILURES_PER_MINUTE: ${SECURITY__AUTH_FAILURES_PER_MINUTE:-10}
  SECURITY__AUTH_FAILURES_GLOBAL_PER_MINUTE: ${SECURITY__AUTH_FAILURES_GLOBAL_PER_MINUTE:-300}
  SECURITY__EMAIL_DISPATCHES_PER_HOUR: ${SECURITY__EMAIL_DISPATCHES_PER_HOUR:-30}
  SECURITY__ACTIVE_RUNS_PER_OWNER: ${SECURITY__ACTIVE_RUNS_PER_OWNER:-2}
  CONNECTORS__GMAIL_SEND_ENABLED: ${CONNECTORS__GMAIL_SEND_ENABLED:-false}
  GEMINI__API_KEY: ${GEMINI__API_KEY:-}
  GEMINI__MODEL: ${GEMINI__MODEL:-}
  GEMINI__DIMENSIONS: ${GEMINI__DIMENSIONS:-768}
  GEMINI__REVISION: ${GEMINI__REVISION:-gemini-embedding-2}
  GEMINI__TIMEOUT_SECONDS: ${GEMINI__TIMEOUT_SECONDS:-12}
  GEMINI__REQUESTS_PER_MINUTE: ${GEMINI__REQUESTS_PER_MINUTE:-5}
  GEMINI__MIN_SIMILARITY: ${GEMINI__MIN_SIMILARITY:-0.5}
  PIPELINE: ${PIPELINE:-{}}
  PIPELINE__OCR_ENABLED: ${PIPELINE__OCR_ENABLED:-true}
  PIPELINE__PARSER_TIMEOUT_SECONDS: ${PIPELINE__PARSER_TIMEOUT_SECONDS:-60}
  CONNECTORS__PUBLIC_URL: ${CONNECTORS__PUBLIC_URL:-http://localhost:3000}
  CONNECTORS__VAULT_KEY: ${CONNECTORS__VAULT_KEY:-}
  CONNECTORS__VAULT_PREVIOUS_KEYS: ${CONNECTORS__VAULT_PREVIOUS_KEYS:-[]}
  CONNECTORS__GOOGLE_CLIENT_ID: ${CONNECTORS__GOOGLE_CLIENT_ID:-}
  CONNECTORS__GOOGLE_CLIENT_SECRET: ${CONNECTORS__GOOGLE_CLIENT_SECRET:-}
  CONNECTORS__GITHUB_CLIENT_ID: ${CONNECTORS__GITHUB_CLIENT_ID:-}
  CONNECTORS__GITHUB_CLIENT_SECRET: ${CONNECTORS__GITHUB_CLIENT_SECRET:-}
  CONNECTORS__GITHUB_APP_ID: ${CONNECTORS__GITHUB_APP_ID:-}
  CONNECTORS__GITHUB_APP_SLUG: ${CONNECTORS__GITHUB_APP_SLUG:-}
  CONNECTORS__GITHUB_PRIVATE_KEY: ${CONNECTORS__GITHUB_PRIVATE_KEY:-}
  CONNECTORS__GITHUB_WEBHOOK_SECRET: ${CONNECTORS__GITHUB_WEBHOOK_SECRET:-}
  CONNECTORS__GITHUB_API_VERSION: ${CONNECTORS__GITHUB_API_VERSION:-2026-03-10}
  CONNECTORS__SLACK_CLIENT_ID: ${CONNECTORS__SLACK_CLIENT_ID:-}
  CONNECTORS__SLACK_CLIENT_SECRET: ${CONNECTORS__SLACK_CLIENT_SECRET:-}
  CONNECTORS__SLACK_SIGNING_SECRET: ${CONNECTORS__SLACK_SIGNING_SECRET:-}
  CONNECTORS__EVENTS_ENABLED: ${CONNECTORS__EVENTS_ENABLED:-false}
  CONNECTORS__GMAIL_PUBSUB_TOPIC: ${CONNECTORS__GMAIL_PUBSUB_TOPIC:-}
  CONNECTORS__GMAIL_PUBSUB_SERVICE_ACCOUNT: ${CONNECTORS__GMAIL_PUBSUB_SERVICE_ACCOUNT:-}
  CONNECTORS__POLLING_SECONDS: ${CONNECTORS__POLLING_SECONDS:-300}
  CONNECTORS__RECONCILIATION_SECONDS: ${CONNECTORS__RECONCILIATION_SECONDS:-86400}
  CONNECTORS__ACL_TTL_SECONDS: ${CONNECTORS__ACL_TTL_SECONDS:-3600}
  CONNECTORS__SLACK_HISTORY_INTERVAL_SECONDS: ${CONNECTORS__SLACK_HISTORY_INTERVAL_SECONDS:-60}
  CONNECTORS__REQUEST_TIMEOUT_SECONDS: ${CONNECTORS__REQUEST_TIMEOUT_SECONDS:-30}
  CONNECTORS__MAX_RESPONSE_BYTES: ${CONNECTORS__MAX_RESPONSE_BYTES:-52428800}
  CONNECTORS__PAGE_SIZE: ${CONNECTORS__PAGE_SIZE:-25}
  CONNECTORS__MAX_SYNC_RESOURCES: ${CONNECTORS__MAX_SYNC_RESOURCES:-100000}
  CONNECTORS__MAX_RETRIES: ${CONNECTORS__MAX_RETRIES:-3}
  CONNECTORS__USER_ACTIONS_PER_MINUTE: ${CONNECTORS__USER_ACTIONS_PER_MINUTE:-30}

services:
  db:
    image: pgvector/pgvector:pg18
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-fixflow}
      POSTGRES_USER: ${POSTGRES_USER:-fixflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - fixflow_postgres:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    <<: *backend-image
    environment: *backend-environment
    command: ["alembic", "upgrade", "head"]
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  backend:
    <<: *backend-image
    environment: *backend-environment
    volumes:
      - fixflow_uploads:/app/data
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3).close()"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  frontend:
    pull_policy: build
    build:
      context: .
      dockerfile: Dockerfile.frontend
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:?Set NEXT_PUBLIC_API_URL in .env}
        NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY:?Set NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY in .env}
        NEXT_PUBLIC_CLERK_SIGN_IN_URL: ${NEXT_PUBLIC_CLERK_SIGN_IN_URL:-/sign-in}
        NEXT_PUBLIC_CLERK_SIGN_UP_URL: ${NEXT_PUBLIC_CLERK_SIGN_UP_URL:-/sign-up}
        NEXT_PUBLIC_CLERK_SIGN_IN_FALLBACK_REDIRECT_URL: ${NEXT_PUBLIC_CLERK_SIGN_IN_FALLBACK_REDIRECT_URL:-/}
        NEXT_PUBLIC_CLERK_SIGN_UP_FALLBACK_REDIRECT_URL: ${NEXT_PUBLIC_CLERK_SIGN_UP_FALLBACK_REDIRECT_URL:-/}
    environment:
      FIXFLOW_API_TOKEN: ${FIXFLOW_API_TOKEN:?Set FIXFLOW_API_TOKEN in .env}
      INTERNAL_API_URL: http://backend:8000
      CONNECTORS__PUBLIC_URL: ${CONNECTORS__PUBLIC_URL:-http://localhost:3000}
      CLERK_SECRET_KEY: ${CLERK_SECRET_KEY:?Set CLERK_SECRET_KEY in .env}
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY:?Set NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY in .env}
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:?Set NEXT_PUBLIC_API_URL in .env}
      NEXT_PUBLIC_CLERK_SIGN_IN_URL: ${NEXT_PUBLIC_CLERK_SIGN_IN_URL:-/sign-in}
      NEXT_PUBLIC_CLERK_SIGN_UP_URL: ${NEXT_PUBLIC_CLERK_SIGN_UP_URL:-/sign-up}
      NEXT_PUBLIC_CLERK_SIGN_IN_FALLBACK_REDIRECT_URL: ${NEXT_PUBLIC_CLERK_SIGN_IN_FALLBACK_REDIRECT_URL:-/}
      NEXT_PUBLIC_CLERK_SIGN_UP_FALLBACK_REDIRECT_URL: ${NEXT_PUBLIC_CLERK_SIGN_UP_FALLBACK_REDIRECT_URL:-/}
    expose:
      - "3000"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

  gateway-init:
    <<: *backend-image
    user: "0:0"
    command: ["python", "-m", "scripts.docker_gateway"]
    environment:
      CONNECTORS__PUBLIC_URL: ${CONNECTORS__PUBLIC_URL:-http://localhost:3000}
    volumes:
      - fixflow_gateway:/gateway
    network_mode: none
    read_only: true
    restart: "no"
    security_opt: ["no-new-privileges:true"]

  gateway:
    image: nginx:1.30.5-alpine3.24@sha256:bf3201ab56f23e5954646379c775d511fc466e9f11376d9725361064ad07ed35
    user: "101:101"
    entrypoint: ["nginx"]
    command: ["-c", "/gateway/nginx.conf", "-g", "daemon off;"]
    volumes:
      - fixflow_gateway:/gateway:ro
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      gateway-init:
        condition: service_completed_successfully
        restart: true
      frontend:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8081/health"]
      interval: 10s
      timeout: 3s
      retries: 3
    read_only: true
    tmpfs: [/tmp]
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]

volumes:
  fixflow_postgres:
  fixflow_uploads:
  fixflow_gateway:
