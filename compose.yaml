x-backend-environment: &backend-environment
  FIXFLOW_API_TOKEN: ${FIXFLOW_API_TOKEN:?Set FIXFLOW_API_TOKEN in .env}
  POSTGRES_HOST: db
  POSTGRES_PORT: "5432"
  POSTGRES_DB: ${POSTGRES_DB:-fixflow}
  POSTGRES_USER: ${POSTGRES_USER:-fixflow}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
  FIXFLOW_DATA_DIR: /app/data
  FRONTEND_ORIGINS: ${FRONTEND_ORIGINS:-http://localhost:3000}
  EMBEDDING_API_URL: ${EMBEDDING_API_URL:-}
  EMBEDDING_API_KEY: ${EMBEDDING_API_KEY:-}
  EMBEDDING_MODEL: ${EMBEDDING_MODEL:-}
  EMBEDDING_DIM: ${EMBEDDING_DIM:-}
  EMBEDDING_TIMEOUT_SECONDS: ${EMBEDDING_TIMEOUT_SECONDS:-30}
  EMBEDDING_BATCH_SIZE: ${EMBEDDING_BATCH_SIZE:-16}
  MAX_EXTRACTED_CHARS: ${MAX_EXTRACTED_CHARS:-5000000}
  MAX_DOCUMENT_CHUNKS: ${MAX_DOCUMENT_CHUNKS:-10000}
  PIPELINE: ${PIPELINE:-{}}
  PIPELINE__OCR_ENABLED: ${PIPELINE__OCR_ENABLED:-true}
  PIPELINE__MAX_CHUNK_TOKENS: ${PIPELINE__MAX_CHUNK_TOKENS:-1024}
  PIPELINE__MIN_CHUNK_TOKENS: ${PIPELINE__MIN_CHUNK_TOKENS:-16}
  PIPELINE__TOKENIZER: ${PIPELINE__TOKENIZER:-utf8_bytes}
  PIPELINE__TOKENIZER_ENCODING: ${PIPELINE__TOKENIZER_ENCODING:-}
  PIPELINE__PARSER_TIMEOUT_SECONDS: ${PIPELINE__PARSER_TIMEOUT_SECONDS:-60}

services:
  db:
    image: pgvector/pgvector:pg18
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-fixflow}
      POSTGRES_USER: ${POSTGRES_USER:-fixflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - fixflow_postgres:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    image: fixflow-backend:local
    build:
      context: .
      dockerfile: Dockerfile.backend
    environment: *backend-environment
    command: ["alembic", "upgrade", "head"]
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  backend:
    image: fixflow-backend:local
    environment: *backend-environment
    volumes:
      - fixflow_uploads:/app/data
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3).close()"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:?Set NEXT_PUBLIC_API_URL in .env}
        NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY:?Set NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY in .env}
        NEXT_PUBLIC_CLERK_SIGN_IN_URL: ${NEXT_PUBLIC_CLERK_SIGN_IN_URL:-/sign-in}
        NEXT_PUBLIC_CLERK_SIGN_UP_URL: ${NEXT_PUBLIC_CLERK_SIGN_UP_URL:-/sign-up}
        NEXT_PUBLIC_CLERK_SIGN_IN_FALLBACK_REDIRECT_URL: ${NEXT_PUBLIC_CLERK_SIGN_IN_FALLBACK_REDIRECT_URL:-/}
        NEXT_PUBLIC_CLERK_SIGN_UP_FALLBACK_REDIRECT_URL: ${NEXT_PUBLIC_CLERK_SIGN_UP_FALLBACK_REDIRECT_URL:-/}
    environment:
      FIXFLOW_API_TOKEN: ${FIXFLOW_API_TOKEN:?Set FIXFLOW_API_TOKEN in .env}
      INTERNAL_API_URL: http://backend:8000
      CLERK_SECRET_KEY: ${CLERK_SECRET_KEY:?Set CLERK_SECRET_KEY in .env}
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY:?Set NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY in .env}
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:?Set NEXT_PUBLIC_API_URL in .env}
      NEXT_PUBLIC_CLERK_SIGN_IN_URL: ${NEXT_PUBLIC_CLERK_SIGN_IN_URL:-/sign-in}
      NEXT_PUBLIC_CLERK_SIGN_UP_URL: ${NEXT_PUBLIC_CLERK_SIGN_UP_URL:-/sign-up}
      NEXT_PUBLIC_CLERK_SIGN_IN_FALLBACK_REDIRECT_URL: ${NEXT_PUBLIC_CLERK_SIGN_IN_FALLBACK_REDIRECT_URL:-/}
      NEXT_PUBLIC_CLERK_SIGN_UP_FALLBACK_REDIRECT_URL: ${NEXT_PUBLIC_CLERK_SIGN_UP_FALLBACK_REDIRECT_URL:-/}
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  fixflow_postgres:
  fixflow_uploads:
