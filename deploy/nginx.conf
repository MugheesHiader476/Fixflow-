worker_processes 2;
pid /tmp/fixflow-nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 1024; }
http {
    # Do not record query strings (OAuth codes), credentials or request bodies.
    log_format safe '$request_method $uri $status $upstream_addr $request_time';
    access_log /dev/stdout safe;
    client_body_temp_path /tmp/client_body;
    proxy_temp_path /tmp/proxy;
    resolver 127.0.0.11 valid=10s ipv6=off;
    upstream fixflow_backend {
        zone fixflow_backend 64k;
        least_conn;
        server backend:8000 resolve max_fails=1 fail_timeout=5s;
        keepalive 32;
    }
    server {
        listen 8000;
        server_tokens off;
        client_max_body_size 52m;
        client_body_timeout 30s;
        location / {
            proxy_pass http://fixflow_backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For "";
            proxy_set_header X-Forwarded-Proto "";
            proxy_set_header Forwarded "";
            proxy_connect_timeout 3s;
            proxy_read_timeout 190s;
            proxy_send_timeout 190s;
            # Replaying a write can repeat a paid call or an ambiguous external send.
            proxy_next_upstream off;
        }
    }
}
