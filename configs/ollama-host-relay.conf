# Fixed Docker Desktop host transport. No user-controlled destination, model management,
# gateway credentials, request-body logs or publicly reachable listener.
worker_processes 1;
error_log /dev/stderr warn;
pid /tmp/nginx.pid;
events { worker_connections 32; }
http {
    access_log off;
    client_max_body_size 1m;
    client_body_timeout 10s;
    proxy_connect_timeout 3s;
    proxy_read_timeout 125s;
    proxy_send_timeout 10s;
    proxy_buffering off;
    proxy_http_version 1.1;
    proxy_pass_request_headers off;
    proxy_set_header Host localhost;
    proxy_set_header Content-Type application/json;
    proxy_set_header Connection "";
    server {
        listen 127.0.0.1:11434;
        if ($args != "") { return 400; }
        location = /api/tags {
            if ($request_method != GET) { return 405; }
            proxy_pass http://host.docker.internal:11434;
        }
        location = /api/embed {
            if ($request_method != POST) { return 405; }
            proxy_pass http://host.docker.internal:11434;
        }
        location / { return 404; }
    }
    server {
        listen 127.0.0.1:11435;
        if ($args != "") { return 400; }
        location = /api/tags {
            if ($request_method != GET) { return 405; }
            proxy_pass http://host.docker.internal:11435;
        }
        location = /api/chat {
            if ($request_method != POST) { return 405; }
            proxy_pass http://host.docker.internal:11435;
        }
        location / { return 404; }
    }
}
